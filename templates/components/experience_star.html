<form class="star-form"
      data-experience-id="{{ experience.id }}">
    {% csrf_token %}

    <button type="submit"
            class="button button-star{% if user in experience.starred_by.all %} is-starred{% endif %}">

        <span aria-hidden="true">★</span>

        <span class="star-text">
            {% if user in experience.starred_by.all %}
                Unstar
            {% else %}
                Star
            {% endif %}
        </span>

        <span class="star-count">
            {{ experience.starred_by.count }}
        </span>
    </button>
</form>
