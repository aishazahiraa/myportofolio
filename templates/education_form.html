{% extends 'base.html' %}

{% block meta %}
<title>Education Form - {{ name }}</title>
{% endblock meta %}

{% block content %}

<div class="education-form-page">

    <div class="education-form-card">

        <h1>Education</h1>

        <p class="form-subtitle">
            Add or update your education information.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <div class="form-actions">

                <button type="submit" class="save-btn">
                    Save
                </button>

                <a href="{% url 'main:more_about_me' %}" class="cancel-btn">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock content %}
